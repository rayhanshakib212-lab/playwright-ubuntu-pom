name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: "Choose browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
jobs:
  tests:
    runs-on: ubuntu-latest



    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.14"

      - name: InstalL dependencies
        run: |
          pip install pytest pytest-playwright allure-pytest pytest-rerunfailures
          playwright install --with-deps chromium firefox webkit


      - name: Run Playwright tests
        run: pytest test_order.py --browser_name "${{ inputs.browser || 'chromium' }}" --alluredir=allure-results


      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
