name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: "Choose browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      suite:
        description: "Choose test suite"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression
          - api
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest



    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install pytest pytest-playwright allure-pytest pytest-rerunfailures pytest-xdist
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.46.1/allure_2.46.1-1_all.deb
          sudo dpkg -i allure_2.46.1-1_all.deb
          allure --version                   
          playwright install --with-deps chromium firefox webkit


      - name: Run Playwright tests
        run: |
          if [ "${{ inputs.suite || 'all' }}" = "all" ]; then
            pytest test_order.py --browser_name "${{ inputs.browser || 'chromium' }}" --alluredir=allure-results
          else
            pytest test_order.py -m "${{ inputs.suite }}" --browser_name "${{ inputs.browser || 'chromium' }}" --alluredir=allure-results
          fi


      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure HTML report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report      

  deploy:
    needs: tests
    if: always()
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4